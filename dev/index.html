<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tado Dash dev harness</title>
<style>
  :root{--primary-background-color:#111;--card-background-color:#1c1c1c;--divider-color:#383838;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--primary-color:#03a9f4;--app-header-background-color:#1c1c1c}
  html,body{margin:0;height:100%;background:#111}
  tado-dash-panel{display:block;height:100vh}
</style>
</head>
<body>
<script>
  // ?mine loads a git-ignored mock of the owner's own home; otherwise the generic one
  document.write('<script src="' + (new URLSearchParams(location.search).has("mine") ? "mock.local.js" : "mock.js") + '"><\/script>');
</script>
<script type="module">
  window.TADO_DASH_BASE = "../custom_components/tado_dash/"; // where the logos live in the repo
  await import("../custom_components/tado_dash/frontend/tado-dash-panel.js");
  if (new URLSearchParams(location.search).has("light")) {
    // Stand-in for a light Home Assistant theme
    const s = document.documentElement.style;
    s.setProperty("--primary-background-color", "#fafafa"); s.setProperty("--card-background-color", "#ffffff");
    s.setProperty("--primary-text-color", "#212121"); s.setProperty("--secondary-text-color", "#727272");
    s.setProperty("--divider-color", "#e0e0e0"); document.body.style.background = "#fafafa";
  }
  const panel = document.createElement("tado-dash-panel");
  document.body.appendChild(panel);
  panel.narrow = new URLSearchParams(location.search).has("narrow");
  panel.hass = window.mockHass;
  setInterval(() => { window.mockHass = { ...window.mockHass }; panel.hass = window.mockHass; }, 5000);
  window.panel = panel;
</script>
</body>
</html>
