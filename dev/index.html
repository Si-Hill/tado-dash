<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tado Dash dev harness</title>
<style>
  :root{--primary-background-color:#111;--card-background-color:#1c1c1c;--divider-color:#383838;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--primary-color:#03a9f4;--app-header-background-color:#1c1c1c}
  html,body{margin:0;height:100%;background:#111}
  tado-dash-panel{display:block;height:100vh}
</style>
</head>
<body>
<script>
  // Stand-in for HA's <ha-icon>: shows a small dot with the icon name as a tooltip.
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    connectedCallback() { this.render(); }
    attributeChangedCallback() { this.render(); }
    render() { this.style.cssText = "width:1em;height:1em;font-size:18px;display:inline-flex;align-items:center;justify-content:center"; this.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="4.5" fill="currentColor" opacity=".55"/></svg>`; this.title = this.getAttribute("icon"); }
  });
</script>
<script src="mock.js"></script>
<script type="module">
  await import("../custom_components/tado_dash/frontend/tado-dash-panel.js");
  const panel = document.createElement("tado-dash-panel");
  document.body.appendChild(panel);
  panel.narrow = new URLSearchParams(location.search).has("narrow");
  panel.hass = window.mockHass;
  setInterval(() => { window.mockHass = { ...window.mockHass }; panel.hass = window.mockHass; }, 5000);
  window.panel = panel;
</script>
</body>
</html>
